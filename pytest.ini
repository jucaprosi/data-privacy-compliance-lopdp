[pytest]
; Sin esto, "pytest tests/" (sin "python -m") no añade la raíz del repo a
; sys.path, y los tests fallan al importar main/app_core/features con
; ModuleNotFoundError. "python -m pytest" lo enmascara porque -m ya inserta
; el directorio actual en sys.path por su cuenta; el pipeline de CI invoca
; pytest directo, sin -m, y por eso lo expone.
;
; Se usa pytest.ini y no pyproject.toml a propósito: Vercel detecta la sola
; presencia de un pyproject.toml como manifiesto de paquete Python gestionado
; por uv e intenta correr "uv lock" contra él, lo que falla si no tiene una
; tabla [project] ("No `project` table found"). pytest.ini logra el mismo
; efecto sin que Vercel lo interprete como manifiesto de paquete.
pythonpath = .
testpaths = tests
