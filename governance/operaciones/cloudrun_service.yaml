# GCP-01 · Servicio Cloud Run del backend (Knative serving v1).
# Equivale a: gcloud run deploy evydentia-backend --cpu-boost --concurrency=80
# Lo aplica una persona: gcloud run services replace governance/operaciones/cloudrun_service.yaml
# IMAGEN y CUENTA_DE_SERVICIO se sustituyen al desplegar; ningún secreto va en este archivo.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: evydentia-backend
  annotations:
    run.googleapis.com/ingress: internal-and-cloud-load-balancing   # GCP-09: solo VPC y balanceador
    run.googleapis.com/invoker-iam-disabled: "true"   # GCP-09: opción 1, sin roles/run.invoker
    # GCP-05 · Presupuesto de conexiones: maxScale × (pool + desborde) <= conexiones que admite la base.
    # Lo comprueba tests/test_gcp05_escalado.py. El pool no se fija en este YAML: es el del motor
    # (app_core/db/session.py), y estas cifras deben coincidir con él.
    evydentia.com/pool-size: "5"
    evydentia.com/max-overflow: "5"
    # PROVISIONAL: 100 no es un dato medido. El propietario debe confirmarlo con
    # `gcloud sql instances describe evydentia-production` (solo lectura); sin esa confirmación la
    # prueba de presupuesto no es definitiva. Si el pool del motor (hoy 5 + 10 por defecto) no coincide
    # con las dos cifras de arriba, este cálculo tampoco lo es: lo decide el Arquitecto.
    evydentia.com/conexiones-base: "100"
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/startup-cpu-boost: "true"   # --cpu-boost
        run.googleapis.com/execution-environment: gen2
        autoscaling.knative.dev/minScale: "1"    # GCP-05: producción sin arranque en frío; pruebas usa 0
        autoscaling.knative.dev/maxScale: "10"   # GCP-05: también es el tope de gasto
    spec:
      containerConcurrency: 80                          # --concurrency=80
      timeoutSeconds: 300
      serviceAccountName: CUENTA_DE_SERVICIO
      containers:
        - image: IMAGEN
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: DB_POOLER_TRANSACCIONAL
              value: "1"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: DATABASE_URL
                  key: latest
