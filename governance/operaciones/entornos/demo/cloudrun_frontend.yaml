# DEMO-07 · Frontend del entorno de demostración (evydentia-web-demo).
# Ingress all, acceso público (allUsers invoker). Se comunica con el backend privado
# mediante autenticación interna con token de servicio (PROXY_AUTH_CLOUD_RUN=token_servicio).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: evydentia-web-demo
  labels:
    entorno: demo
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/startup-cpu-boost: "true"
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
    spec:
      containerConcurrency: 80
      serviceAccountName: 517105327086-compute@developer.gserviceaccount.com
      containers:
        # DEMO-09 · Imagen web de producción, sin etiqueta ni digest: el digest del commit lo fija el paso de DEMO_COMERCIAL.md §5.
        - image: us-central1-docker.pkg.dev/evydentia/evydentia-containers/web
          ports:
            - name: http1
              containerPort: 3000
          env:
            - name: APP_ENV
              value: demo
            - name: BACKEND_URL
              value: https://evydentia-backend-demo-ponc6sfqtq-uc.a.run.app
            - name: PROXY_AUTH_CLOUD_RUN
              value: token_servicio
            # Informativa: Next la incrusta al compilar; debe ser igual al --build-arg de frontend/cloudbuild.yaml.
            - name: NEXT_PUBLIC_GOOGLE_CLIENT_ID
              value: 943042355099-um6ieu8s1s8kettg253g9v5ms8ag7k4l.apps.googleusercontent.com
---
# Política IAM de invocación
invocadores:
  - member: allUsers
    role: roles/run.invoker
