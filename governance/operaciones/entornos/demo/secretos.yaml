    contenido: Clave de firma de tokens JWT de sesión
    leen: [517105327086-compute@developer.gserviceaccount.com]
  - nombre: SESSION_SECRET
    contenido: Clave de cifrado de cookies y sesiones
    leen: [517105327086-compute@developer.gserviceaccount.com]
  - nombre: INVENTARIO_CLAVE_CIFRADO
    contenido: Clave AES para campos cifrados del inventario de tratamientos
    leen: [517105327086-compute@developer.gserviceaccount.com]
