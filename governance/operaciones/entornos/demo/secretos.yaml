proyecto: evydentia-demo
secretos:
  - nombre: DEMO_VENDEDORES
    contenido: Lista de correos de vendedores autorizados para crear y operar demos (separados por coma)
    leen: [517105327086-compute@developer.gserviceaccount.com]
