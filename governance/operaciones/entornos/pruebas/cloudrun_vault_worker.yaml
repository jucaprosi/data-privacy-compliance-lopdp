# EP-04 · Satélite vault_worker (Go) del entorno de pruebas (GOVW-01, aún pendiente).
# Producción todavía no versiona su manifiesto: la referencia es GOVW-01 (Cloud Run, min-instances=0) y el
# PRD EVYDENTIA §5.5 («los mismos servicios, con los mismos nombres»). Recibe eventos de Eventarc de los dos
# buckets de la bóveda (buckets.yaml) y no tiene IAP ni acceso público.
# La imagen va por digest (EP-06). Ningún secreto en este archivo.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: evydentia-vault-worker
  labels:
    entorno: pruebas
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: sa-vault-worker-pruebas@PROYECTO_PRUEBAS.iam.gserviceaccount.com
      containers:
        - image: IMAGEN_POR_DIGEST
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: APP_ENV
              value: pruebas
            - name: HUELLA_PROYECTO_PRODUCCION
              value: HUELLA_DEL_PROYECTO_DE_PRODUCCION
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: evydentia-pruebas-database-url
                  key: latest
