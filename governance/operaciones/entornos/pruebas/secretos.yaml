# EP-05 · Secretos de Secret Manager del proyecto de pruebas (PRD EVYDENTIA §5.5 e invariante 56).
# Solo el nombre y quién lo lee: ningún valor va en este archivo ni en el repositorio.
# Ninguno se comparte con producción: todos llevan el prefijo evydentia-pruebas- y viven en el proyecto de
# pruebas, cuyas cuentas de servicio no tienen permisos en el de producción (ni al revés).
# Correo: decisión del propietario del 2026-11-07. El envío queda apagado y sin proveedor en todos los
# entornos de Google Cloud, así que no hay ningún secreto de correo (tampoco de Resend).
# Los crea el propietario con Antigravity; ninguna sesión de IA crea secretos.
proyecto: PROYECTO_PRUEBAS
secretos:
  - nombre: evydentia-pruebas-database-url
    contenido: URL de la aplicación (rol lopdp_app) hacia la instancia evydentia-pruebas
    leen: [sa-backend-pruebas, sa-vault-worker-pruebas]
  - nombre: evydentia-pruebas-migration-database-url
    contenido: URL del dueño de las tablas (lopdp_beta_owner), solo para migrar y sembrar
    leen: [sa-migraciones-pruebas]
  - nombre: evydentia-pruebas-oidc-client-secret
    contenido: secreto del cliente OAuth de Google del entorno de pruebas
    leen: [sa-frontend-pruebas, sa-backend-pruebas]
  - nombre: evydentia-pruebas-anf-credenciales
    contenido: credenciales del entorno de pruebas de ANF, o vacío mientras rige el boceto de FIRMA-06 (decisión 4)
    leen: [sa-backend-pruebas]
  - nombre: evydentia-pruebas-memorystore-auth
    contenido: clave de Memorystore, solo si la decisión 2 elige la instancia mínima
    leen: [sa-backend-pruebas]
    condicional: decision_2_memorystore
