# GCP-05 · Presupuesto de conexiones del backend a PostgreSQL.
# Regla: maxScale × (pool_size + max_overflow) + reservadas <= max_connections.
# Lo comprueba tests/test_gcp05_escalado.py. El pool real sale de DB_POOL_SIZE y DB_MAX_OVERFLOW
# del manifiesto del backend (app_core/db/session.py los lee y exige en Cloud Run).
max_connections: 100
# Confirmación de solo lectura (GCP-05b, 2026-11-21):
#   - Producción (evydentia-production, db-f1-micro): SHOW max_connections; = 25 (por defecto en PostgreSQL 16 sin flag).
#   - Pruebas (evydentia-pruebas, db-g1-small): SHOW max_connections; = 50.
# Para alcanzar las 100 conexiones del presupuesto de producción declarado en cloud_sql_instance.yaml
# (tier db-custom-1-3840), la instancia de producción requiere la bandera max_connections=100 o el tier custom.
provisional: true
reservadas: 10   # 2 de ellas para migración manual
consumidores:
  backend: evydentia-backend
  purga_demo: otra base de datos; límite pendiente (DEMO-05)
  migracion: 0   # sin Job de migración todavía
