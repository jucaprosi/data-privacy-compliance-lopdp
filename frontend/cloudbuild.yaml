# GCP-03b · Imagen web de EVYDENTIA etiquetada por commit. Se lanza desde frontend/:
#   gcloud builds submit --config cloudbuild.yaml --substitutions=_ETIQUETA=$(git rev-parse --short HEAD) .
# _ETIQUETA no tiene valor por defecto y substitutionOption es MUST_MATCH: sin ella, Cloud Build rechaza la
# construcción. El client id de Google entra al compilar (--build-arg; frontend/Dockerfile.cloudrun lo declara).
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.cloudrun'
      - '-t'
      - 'us-central1-docker.pkg.dev/evydentia/evydentia-containers/web:${_ETIQUETA}'
      - '--build-arg'
      - 'NEXT_PUBLIC_GOOGLE_CLIENT_ID=943042355099-um6ieu8s1s8kettg253g9v5ms8ag7k4l.apps.googleusercontent.com'
      - '.'
images:
  - 'us-central1-docker.pkg.dev/evydentia/evydentia-containers/web:${_ETIQUETA}'
options:
  substitutionOption: 'MUST_MATCH'
