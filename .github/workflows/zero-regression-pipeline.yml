name: Zero Regression Pipeline

on:
  # main y las ramas personales de la regla 10 (dev/juan-carlos, dev/aleczandra, dev/jose):
  # los PR hacia una rama dev/ y sus pushes tambien pasan por el arnes y Playwright.
  push:
    branches:
      - main
      - 'dev/**'
  pull_request:
    branches:
      - main
      - 'dev/**'

jobs:
  zero-regression:
    name: Arnés Físico Determinista
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt es la fuente real de dependencias del proyecto;
          # una lista aparte a mano se desincroniza en cuanto se agrega una
          # dependencia nueva (paso exactamente por eso: defusedxml y
          # pydantic-settings faltaban aquí pese a estar en requirements.txt).
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Alcance del PR frente a la ficha de su tarea
        if: github.event_name == 'pull_request'
        env:
          RAMA: ${{ github.head_ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          CABEZA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/verificar_alcance_pr.py --rama "$RAMA" --base "$BASE" --cabeza "$CABEZA"

      - name: Linting de Arquitectura (BOM y Huellas abiertas)
        run: |
          python -c "
          import os, sys
          bom = b'\xef\xbb\xbf'
          fallos = []
          for r, d, f in os.walk('.'):
              if any(ign in r for ign in ['.git', 'node_modules', '.pytest_cache', '__pycache__', 'verificadores']): continue
              for file in f:
                  path = os.path.join(r, file)
                  if file.endswith(('.py', '.md')):
                      try:
                          with open(path, 'rb') as x:
                              if x.read(3) == bom: fallos.append(path)
                      except: pass
                  if file.endswith('.py'):
                      try:
                          with open(path, 'r', encoding='utf-8') as x:
                              for idx, line in enumerate(x, 1):
                                  if chr(166) in line: fallos.append(f'{path}:L{idx}')
                      except: pass
          if fallos: sys.exit(f'❌ Invariante roto (BOM o Huellas): {fallos}')
          print('✅ Cero huellas abiertas y sin BOM.')
          "

      # Node y las dependencias del frontend van antes de pytest: tests/test_banco_preguntas.py
      # compila el banco TypeScript con frontend/node_modules/typescript (DIAG-02).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend Install
        working-directory: ./frontend
        run: npm install

      # Solo compara: las migraciones se siguen aplicando a mano (REGISTRO_MIGRACIONES_MANUALES.md).
      # Va antes de pytest para que una base sin migrar falle con la causa y no con decenas de pruebas.
      # El ancla mantiene una sola regla de eleccion de base para este paso y para pytest.
      - name: Base de pruebas en la cabeza de Alembic
        env: &base_de_pruebas
          # Rama Neon de pruebas (rol dueño); los tests de RLS hacen SET ROLE lopdp_app.
          # La base sale del nombre de la rama: dev/<persona> o tarea/<persona>/... usan la de
          # esa persona (test-<persona>, hija de test-main); main y lo demás usan test-main.
          # Si falta el secreto de la persona, se usa test-main.
          TEST_DATABASE_URL: ${{ (contains(github.head_ref || github.ref_name, 'juan-carlos') && secrets.TEST_DATABASE_URL_JUAN_CARLOS) || (contains(github.head_ref || github.ref_name, 'aleczandra') && secrets.TEST_DATABASE_URL_ALECZANDRA) || (contains(github.head_ref || github.ref_name, 'jose') && secrets.TEST_DATABASE_URL_JOSE) || secrets.TEST_DATABASE_URL }}
        run: python scripts/verificar_revision_alembic.py

      - name: Backend Pytest (E2E y Unitarias)
        env: *base_de_pruebas
        run: pytest tests/ -v

      - name: Frontend Build
        working-directory: ./frontend
        run: npm run build

  playwright:
    # Job aparte: no altera el check obligatorio "Arnés Físico Determinista".
    # Las pruebas simulan la API (page.route), así que no necesitan backend ni secretos.
    name: Playwright Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Chromium
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright Tests
        working-directory: ./frontend
        env:
          CI: "true"
        run: npx playwright test

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
