name: Zero Regression Pipeline

on:
  # Flujo convencional (regla 10, 2026-11-05): cada tarea/<persona>/<id> abre su PR directo a main.
  # El PR es la rama del colaborador: humo como compuerta, PostgreSQL en contenedor, pytest en paralelo y
  # arnes por salas o completo segun el diff. El push a main (la fusion) es la red de seguridad: sin humo,
  # arnes completo obligatorio y en serie contra Neon (test-main), hasta que GCP-04 lo mueva a Cloud SQL.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Un push nuevo a la misma rama o al mismo PR deja obsoleta la corrida anterior: se cancela y libera su runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  alcance:
    # Decide que arnes corre (ADPA §3, ADR 0001). Un PR confinado a salas corre las pruebas de esas salas,
    # las de sus dependientes y el nucleo; uno que toca lo compartido corre todo. Un push corre siempre todo:
    # la seleccion es una heuristica que amplia lo elegido y la fusion vuelve a comprobar la suite entera.
    name: Alcance de la corrida
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      modo: ${{ steps.destino.outputs.modo }}
      etiqueta: ${{ steps.destino.outputs.etiqueta }}
      hacia_main: ${{ steps.destino.outputs.hacia_main }}
      pruebas: ${{ steps.seleccion.outputs.pruebas }}
      frontend: ${{ steps.seleccion.outputs.frontend }}
      node: ${{ steps.seleccion.outputs.node }}
      cubierta: ${{ steps.cubierta.outputs.cubierta }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Alcance del PR frente a la ficha de su tarea
        if: github.event_name == 'pull_request'
        env:
          RAMA: ${{ github.head_ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          CABEZA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/verificar_alcance_pr.py --rama "$RAMA" --base "$BASE" --cabeza "$CABEZA"

      - name: Seleccionar las pruebas segun los archivos cambiados
        id: seleccion
        env:
          # Vacias en un push: el selector responde "completo".
          BASE: ${{ github.event.pull_request.base.sha }}
          CABEZA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/seleccionar_pruebas.py --base "$BASE" --cabeza "$CABEZA" --salida-github

      # Hacia main (el push de la fusion) el arnes completo es obligatorio, toque lo que toque el diff, y el
      # humo no corre: ya corrio en el PR. En los PR de tarea/** manda la seleccion por salas y el humo es
      # compuerta (governance/operaciones/PRUEBAS_DE_HUMO.md). La condicion es por tipo de evento, no por
      # rama destino: una optimizacion atada a la topologia de ramas se apaga cuando la topologia cambia
      # (APORTES_INEDITOS.md, Aporte 127).
      - name: Destino de la corrida
        id: destino
        env:
          HACIA_MAIN: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          MODO: ${{ steps.seleccion.outputs.modo }}
          ETIQUETA: ${{ steps.seleccion.outputs.etiqueta }}
        run: |
          if [ "$HACIA_MAIN" = "true" ]; then
            MODO=completo
            ETIQUETA="completo: main exige el arnes completo"
          fi
          echo "Destino: $([ "$HACIA_MAIN" = "true" ] && echo main || echo rama de colaborador) | modo: $MODO"
          { echo "hacia_main=$HACIA_MAIN"; echo "modo=$MODO"; echo "etiqueta=$ETIQUETA"; } >> "$GITHUB_OUTPUT"

      # Un arnes por commit (CI-03): un PR adopta la corrida del push sobre el mismo commit si paso y la rama
      # esta al dia. Sin ramas dev/** ya no hay push que adoptar (on.push solo cubre main) y un PR hacia main
      # nunca adopta, asi que el paso responde "sin cubrir" y el PR corre su propio arnes. Se conserva por si
      # vuelve a haber una rama con push propio; retirarlo es decision de CI-14 o de quien lo mida.
      - name: Reutilizar la corrida del push sobre el mismo commit
        id: cubierta
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          RAMA_BASE: ${{ github.base_ref }}
        run: python scripts/corrida_cubierta.py --sha "$SHA" --base "$BASE" --rama-base "$RAMA_BASE" --corrida "$GITHUB_RUN_ID" --repositorio "$GITHUB_REPOSITORY" --salida-github

  humo:
    # Compuerta de fallo rapido (governance/operaciones/PRUEBAS_DE_HUMO.md): Next.js y FastAPI reales contra el
    # PostgreSQL del runner, en modo oidc y sin page.route. Si falla, los arneses y Playwright no arrancan.
    # Corre en todo PR (tarea/** hacia main); en el push a main se omite y los arneses arrancan igual, porque
    # main exige el arnes completo sobre un trabajo que ya paso el humo en su PR.
    # Reparto de bases, una sola regla para el humo y los dos arneses: en los PR, un contenedor sin secretos
    # cuya contrasena solo existe en este runner; en el push a main, la rama Neon test-main. Si hacia_main no
    # dice 'false', la URL cae en Neon y el servicio no arranca: nunca hay contenedor hacia main.
    name: Humo de extremo a extremo
    needs: alcance
    if: needs.alcance.outputs.cubierta == '' && needs.alcance.outputs.hacia_main != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services: &postgres_de_las_ramas
      postgres:
        image: ${{ needs.alcance.outputs.hacia_main == 'false' && 'pgvector/pgvector:pg16' || '' }}
        env:
          POSTGRES_USER: lopdp_beta_owner
          POSTGRES_PASSWORD: solo-en-este-runner
          POSTGRES_DB: lopdp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lopdp_beta_owner -d lopdp"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env: &base_de_pruebas
      TEST_DATABASE_URL: ${{ (needs.alcance.outputs.hacia_main == 'false' && 'postgresql://lopdp_beta_owner:solo-en-este-runner@localhost:5432/lopdp') || secrets.TEST_DATABASE_URL }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      # Lo mas barato primero: una migracion rota falla aqui, antes de compilar nada.
      - &migrar_contenedor
        name: Migrar el contenedor a la cabeza de Alembic
        if: needs.alcance.outputs.hacia_main == 'false'
        env:
          # Literal a proposito: solo puede apuntar al servicio del runner, nunca a un secreto de Neon.
          MIGRATION_DATABASE_URL: postgresql://lopdp_beta_owner:solo-en-este-runner@localhost:5432/lopdp
        run: python -m alembic upgrade head

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - &cache_compilacion
        name: Cache de compilacion de Next
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: next-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**') }}
          restore-keys: next-${{ hashFiles('frontend/package-lock.json') }}-

      # Next fija el destino del proxy /api/v1 al compilar.
      - name: Frontend Build
        working-directory: ./frontend
        env:
          BACKEND_URL: http://127.0.0.1:5200
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: humo-ci
        run: npm run build

      - name: Install Chromium
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Flujos de humo
        working-directory: ./frontend
        env:
          CI: "true"
        run: npx playwright test -c playwright.humo.config.ts

      - name: Upload Humo Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: humo-report
          path: frontend/test-results/
          retention-days: 7

  arnes-salas:
    name: Arnés por salas
    needs: [alcance, humo]
    # Arranca si el humo paso o se omitio (hacia main no corre); nunca si fallo o fue cancelado.
    if: ${{ !cancelled() && (needs.humo.result == 'success' || needs.humo.result == 'skipped') && needs.alcance.outputs.modo == 'salas' && needs.alcance.outputs.cubierta == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    services: *postgres_de_las_ramas
    env: *base_de_pruebas

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Una corrida a la vez en Neon (test-main): espera, por orden de numero de corrida, a que terminen los
      # arneses de las corridas anteriores hacia main. Si la API no responde, sigue sin esperar.
      # El contenedor es de la corrida: en los PR no hay turno que esperar.
      - name: Esperar turno en la rama de Neon
        if: needs.alcance.outputs.hacia_main == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: python scripts/esperar_turno_neon.py --rama "$RAMA" --corrida "$GITHUB_RUN_ID" --repositorio "$GITHUB_REPOSITORY"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      # En paralelo solo contra el contenedor: cada trabajador clona su base de la ya migrada (tests/conftest.py).
      # En el push a main no: en Neon no hay plantilla que clonar y la suite sigue en serie.
      - &instalar_xdist
        name: Instalar pytest-xdist
        if: needs.alcance.outputs.hacia_main == 'false'
        run: pip install pytest-xdist==3.8.0

      - name: Linting de Arquitectura (BOM y Huellas abiertas)
        run: python scripts/verificar_bom_huellas.py

      # Node solo si una prueba elegida lo invoca (tests/test_banco_preguntas.py) o si cambio el frontend.
      - name: Setup Node.js
        if: needs.alcance.outputs.node == 'true' || needs.alcance.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend Install
        if: needs.alcance.outputs.node == 'true' || needs.alcance.outputs.frontend == 'true'
        working-directory: ./frontend
        run: npm ci

      # En los PR la base nace vacia y se migra aqui. En Neon solo se compara: esas migraciones las aplica el
      # flujo migrar-bases-neon tras la fusion o una persona a mano (REGISTRO_MIGRACIONES_MANUALES.md).
      - *migrar_contenedor

      - name: Base de pruebas en la cabeza de Alembic
        if: needs.alcance.outputs.hacia_main == 'true'
        run: python scripts/verificar_revision_alembic.py

      - name: Backend Pytest (salas tocadas, dependientes y nucleo)
        env:
          PRUEBAS: ${{ needs.alcance.outputs.pruebas }}
          ETIQUETA: ${{ needs.alcance.outputs.etiqueta }}
          PARALELO: ${{ needs.alcance.outputs.hacia_main == 'false' && '-n auto' || '' }}
        run: |
          echo "Alcance: $ETIQUETA"
          pytest $PRUEBAS -v $PARALELO

      - name: Frontend Build
        if: needs.alcance.outputs.frontend == 'true'
        working-directory: ./frontend
        run: npm run build

  arnes-completo:
    name: Arnés completo
    needs: [alcance, humo]
    # Arranca si el humo paso o se omitio (hacia main no corre); nunca si fallo o fue cancelado.
    if: ${{ !cancelled() && (needs.humo.result == 'success' || needs.humo.result == 'skipped') && needs.alcance.outputs.modo == 'completo' && needs.alcance.outputs.cubierta == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    services: *postgres_de_las_ramas
    env: *base_de_pruebas

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Una corrida a la vez en Neon (test-main): espera, por orden de numero de corrida, a que terminen los
      # arneses de las corridas anteriores hacia main. Si la API no responde, sigue sin esperar.
      # El contenedor es de la corrida: en los PR no hay turno que esperar.
      - name: Esperar turno en la rama de Neon
        if: needs.alcance.outputs.hacia_main == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: python scripts/esperar_turno_neon.py --rama "$RAMA" --corrida "$GITHUB_RUN_ID" --repositorio "$GITHUB_REPOSITORY"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt es la fuente real de dependencias del proyecto;
          # una lista aparte a mano se desincroniza en cuanto se agrega una
          # dependencia nueva (paso exactamente por eso: defusedxml y
          # pydantic-settings faltaban aquí pese a estar en requirements.txt).
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - *instalar_xdist

      - name: Linting de Arquitectura (BOM y Huellas abiertas)
        run: python scripts/verificar_bom_huellas.py

      # Node y las dependencias del frontend van antes de pytest: tests/test_banco_preguntas.py
      # compila el banco TypeScript con frontend/node_modules/typescript (DIAG-02).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend Install
        working-directory: ./frontend
        run: npm ci

      # En los PR la base nace vacia y se migra aqui. En Neon solo se compara: esas migraciones las aplica el
      # flujo migrar-bases-neon tras la fusion o una persona a mano (REGISTRO_MIGRACIONES_MANUALES.md). Va antes
      # de pytest para que una base sin migrar falle con la causa y no con decenas de pruebas.
      - *migrar_contenedor

      - name: Base de pruebas en la cabeza de Alembic
        if: needs.alcance.outputs.hacia_main == 'true'
        run: python scripts/verificar_revision_alembic.py

      - name: Backend Pytest (E2E y Unitarias)
        env:
          PARALELO: ${{ needs.alcance.outputs.hacia_main == 'false' && '-n auto' || '' }}
        run: pytest tests/ -v $PARALELO

      - *cache_compilacion

      - name: Frontend Build
        working-directory: ./frontend
        run: npm run build

  zero-regression:
    # Compuerta con el nombre que exigen las reglas de la rama: pasa solo si el arnes que corrio paso.
    name: Arnés Físico Determinista
    needs: [alcance, humo, arnes-salas, arnes-completo]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Un arnes corrio y paso
        env:
          ALCANCE: ${{ needs.alcance.result }}
          ETIQUETA: ${{ needs.alcance.outputs.etiqueta }}
          CUBIERTA: ${{ needs.alcance.outputs.cubierta }}
          HACIA_MAIN: ${{ needs.alcance.outputs.hacia_main }}
          HUMO: ${{ needs.humo.result }}
          SALAS: ${{ needs.arnes-salas.result }}
          COMPLETO: ${{ needs.arnes-completo.result }}
        run: |
          echo "alcance=$ALCANCE ($ETIQUETA) | hacia main=$HACIA_MAIN | cubierta=$CUBIERTA | humo=$HUMO | arnes por salas=$SALAS | arnes completo=$COMPLETO"
          if [ "$HACIA_MAIN" = "true" ] && [ -z "$CUBIERTA" ] && [ "$COMPLETO" != "success" ]; then echo "Hacia main el arnes completo es obligatorio y no paso."; exit 1; fi
          test "$ALCANCE" = "success" || { echo "La seleccion de alcance no termino bien."; exit 1; }
          if [ -n "$CUBIERTA" ]; then echo "Cubierto por la corrida $CUBIERTA del push, que ya verifico este mismo commit."; exit 0; fi
          test "$HUMO" != "failure" || { echo "El humo fallo: los arneses y Playwright no arrancaron. Corrija el flujo que fallo."; exit 1; }
          case "$HUMO$SALAS$COMPLETO" in
            *cancelled*) echo "Un arnes fue cancelado: alguien detuvo la corrida o una mas nueva de la misma rama la dejo obsoleta. Si hace falta, vuelva a lanzar los jobs."; exit 1;;
            *failure*) echo "Un arnes fallo."; exit 1;;
          esac
          test "$SALAS" = "success" || test "$COMPLETO" = "success" || { echo "Ningun arnes corrio."; exit 1; }

  playwright:
    # Job aparte: no altera el check obligatorio "Arnés Físico Determinista".
    # Las pruebas simulan la API (page.route), así que no necesitan backend ni secretos.
    # Espera al humo y no arranca si falla. Con la corrida cubierta se omite: el push ya lo paso sobre este commit
    # (scripts/corrida_cubierta.py no adopta sin el) y un job omitido no bloquea el PR.
    name: Playwright Frontend
    needs: [alcance, humo]
    if: ${{ !cancelled() && (needs.humo.result == 'success' || needs.humo.result == 'skipped') && needs.alcance.outputs.cubierta == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Chromium
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright Tests
        working-directory: ./frontend
        env:
          CI: "true"
        run: npx playwright test

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
