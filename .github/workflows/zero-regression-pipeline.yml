name: Zero Regression Pipeline

on:
  # Flujo convencional (regla 10, 2026-11-05): cada tarea/<persona>/<id> abre su PR directo a main.
  # El PR es la rama del colaborador: humo como compuerta, PostgreSQL en contenedor, pytest en paralelo y
  # arnes por salas o completo segun el diff. El push a main (la fusion) es la red de seguridad: sin humo y
  # con el arnes que pida el diff, salvo que el PR ya haya verificado exactamente el mismo arbol (CI-37, R1).
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Un push nuevo al mismo PR deja obsoleta la corrida anterior: se cancela y libera su runner.
# En el push a main cada corrida tiene su propio contenedor PostgreSQL 16 y su propio grupo por run_id:
# no comparte base ni hace fila con otras fusiones.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI-37: dos jobs, uno por check obligatorio del ruleset. GitHub redondea cada job al minuto: los pasos cortos
# (alcance, veredicto) viven dentro del job largo y no facturan un minuto propio cada uno.
jobs:
  arnes:
    # En un solo job y en este orden: alcance, comprobar (solo en push), humo (solo en PR), el arnes por salas o
    # completo segun el modo, registrar (solo en PR y en verde) y el veredicto que decide el check.
    # Un contenedor PostgreSQL 16 sin secretos cuya contrasena solo existe en este runner, que nace vacio y muere
    # con el job. El humo trabaja sobre un clon de la base migrada: la base del arnes llega intacta a pytest.
    name: Arnés Físico Determinista
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      # arbol_verificado.py comprobar lee GET /repos/<r>/commits/<sha>/pulls.
      pull-requests: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lopdp_beta_owner
          POSTGRES_PASSWORD: solo-en-este-runner
          POSTGRES_DB: lopdp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lopdp_beta_owner -d lopdp"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://lopdp_beta_owner:solo-en-este-runner@localhost:5432/lopdp

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ---- Alcance (ADPA §3, ADR 0001) ------------------------------------------------------------------
      # Un PR confinado a salas corre las pruebas de esas salas, las de sus dependientes y el nucleo; uno que
      # toca lo compartido corre todo. En el push a main manda la misma seleccion sobre el diff de la fusion (CI-32).
      - name: Alcance del PR frente a la ficha de su tarea
        if: github.event_name == 'pull_request'
        env:
          RAMA: ${{ github.head_ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          CABEZA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/verificar_alcance_pr.py --rama "$RAMA" --base "$BASE" --cabeza "$CABEZA"

      - &seleccionar_pruebas
        name: Seleccionar las pruebas segun los archivos cambiados
        id: seleccion
        env:
          EVENTO: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_CABEZA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENTO" = "pull_request" ]; then
            BASE="$PR_BASE"
            CABEZA="$PR_CABEZA"
          else
            BASE="$PUSH_BEFORE"
            CABEZA="$PUSH_SHA"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="HEAD~1"
            fi
          fi
          python scripts/seleccionar_pruebas.py --base "$BASE" --cabeza "$CABEZA" --salida-github

      - name: Destino de la corrida
        id: destino
        env:
          HACIA_MAIN: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          MODO: ${{ steps.seleccion.outputs.modo || 'completo' }}
          ETIQUETA: ${{ steps.seleccion.outputs.etiqueta }}
          NODE: ${{ steps.seleccion.outputs.node }}
          FRONTEND: ${{ steps.seleccion.outputs.frontend }}
        run: |
          echo "Destino: $([ "$HACIA_MAIN" = "true" ] && echo main || echo rama de colaborador) | modo: $MODO"
          # Node hace falta para el humo (todo PR), para el arnes completo y, por salas, si una prueba elegida lo
          # invoca (tests/test_banco_preguntas.py) o si cambio el frontend.
          NODE_REQUERIDO=false
          if [ "$HACIA_MAIN" != "true" ] || [ "$MODO" = "completo" ] || [ "$NODE" = "true" ] || [ "$FRONTEND" = "true" ]; then
            NODE_REQUERIDO=true
          fi
          { echo "hacia_main=$HACIA_MAIN"; echo "modo=$MODO"; echo "etiqueta=$ETIQUETA"; echo "node=$NODE_REQUERIDO"; } >> "$GITHUB_OUTPUT"

      # ---- Comprobar (R1, solo en push) -----------------------------------------------------------------
      # Un arnes por arbol: si la ultima corrida en verde del PR fusionado verifico exactamente este arbol con un
      # modo igual o mas amplio, el push no lo repite. Ante cualquier fallo escribe cubierto= y el arnes corre.
      - &comprobar_arbol
        name: Comprobar el arbol verificado por el PR
        id: comprobar
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MODO: ${{ steps.seleccion.outputs.modo || 'completo' }}
        run: python scripts/arbol_verificado.py comprobar --sha "$GITHUB_SHA" --modo "$MODO" --repositorio "$GITHUB_REPOSITORY" --salida-github

      # ---- Preparacion comun del humo y del arnes -------------------------------------------------------
      - name: Install Python Dependencies
        if: steps.comprobar.outputs.cubierto == ''
        run: |
          python -m pip install --upgrade pip
          # requirements.txt es la fuente real de dependencias del proyecto;
          # una lista aparte a mano se desincroniza en cuanto se agrega una
          # dependencia nueva (paso exactamente por eso: defusedxml y
          # pydantic-settings faltaban aquí pese a estar en requirements.txt).
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      # En paralelo contra el contenedor del runner: cada trabajador clona su base de la ya migrada (tests/conftest.py).
      - name: Instalar pytest-xdist
        if: steps.comprobar.outputs.cubierto == ''
        run: pip install pytest-xdist==3.8.0

      - name: Setup Node.js
        if: steps.comprobar.outputs.cubierto == '' && steps.destino.outputs.node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Node y las dependencias del frontend van antes de pytest: tests/test_banco_preguntas.py
      # compila el banco TypeScript con frontend/node_modules/typescript (DIAG-02).
      - name: Install Frontend Dependencies
        if: steps.comprobar.outputs.cubierto == '' && steps.destino.outputs.node == 'true'
        working-directory: ./frontend
        run: npm ci

      # El contenedor nace vacio en cada corrida y se migra aqui, una sola vez, antes del humo y de pytest: una
      # migracion rota falla con la causa, antes de compilar nada y no con decenas de pruebas.
      - name: Migrar el contenedor a la cabeza de Alembic
        if: steps.comprobar.outputs.cubierto == ''
        env:
          # Literal a proposito: solo puede apuntar al servicio local del runner, nunca a un secreto externo.
          MIGRATION_DATABASE_URL: postgresql://lopdp_beta_owner:solo-en-este-runner@localhost:5432/lopdp
        run: python -m alembic upgrade heads

      - name: Cache de compilacion de Next
        if: steps.comprobar.outputs.cubierto == '' && steps.destino.outputs.node == 'true'
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: next-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**') }}
          restore-keys: next-${{ hashFiles('frontend/package-lock.json') }}-

      # ---- Humo (solo en PR; governance/operaciones/PRUEBAS_DE_HUMO.md) -----------------------------------
      # Compuerta de fallo rapido: Next.js y FastAPI reales contra el PostgreSQL del runner, en modo oidc y sin
      # page.route. Si falla, el arnes no arranca. En el push a main se omite: ya fue compuerta en el PR.
      - name: Clonar la base migrada para el humo
        if: github.event_name == 'pull_request'
        env:
          BASE_DEL_RUNNER: postgresql://lopdp_beta_owner:solo-en-este-runner@localhost:5432/postgres
        run: python -c "import os, psycopg; psycopg.connect(os.environ['BASE_DEL_RUNNER'], autocommit=True).execute('CREATE DATABASE lopdp_humo TEMPLATE lopdp')"

      # Next fija el destino del proxy /api/v1 al compilar.
      - name: Frontend Build del humo
        if: github.event_name == 'pull_request'
        working-directory: ./frontend
        env:
          BACKEND_URL: http://127.0.0.1:5200
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: humo-ci
        run: npm run build

      - name: Install Chromium
        if: github.event_name == 'pull_request'
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Flujos de humo
        id: humo
        if: github.event_name == 'pull_request'
        working-directory: ./frontend
        timeout-minutes: 15
        env:
          CI: "true"
          TEST_DATABASE_URL: postgresql://lopdp_beta_owner:solo-en-este-runner@localhost:5432/lopdp_humo
        run: npx playwright test -c playwright.humo.config.ts

      - name: Upload Humo Report
        if: failure() && steps.humo.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: humo-report
          path: frontend/test-results/
          retention-days: 7

      # ---- Arnes por salas o completo (CI-32) -----------------------------------------------------------
      - name: Linting de Arquitectura (BOM y Huellas abiertas)
        if: steps.comprobar.outputs.cubierto == ''
        run: python scripts/verificar_bom_huellas.py

      - name: Backend Pytest (salas tocadas, dependientes y nucleo)
        if: steps.comprobar.outputs.cubierto == '' && steps.destino.outputs.modo == 'salas'
        env:
          PRUEBAS: ${{ steps.seleccion.outputs.pruebas }}
          ETIQUETA: ${{ steps.seleccion.outputs.etiqueta }}
        run: |
          echo "Alcance: $ETIQUETA"
          pytest $PRUEBAS -v -n auto

      - name: Frontend Build (salas)
        if: steps.comprobar.outputs.cubierto == '' && steps.destino.outputs.modo == 'salas' && steps.seleccion.outputs.frontend == 'true'
        working-directory: ./frontend
        run: npm run build

      # Solo llega a success si todos los pasos anteriores pasaron: es el resultado del arnes por salas.
      - name: Arnes por salas en verde
        id: salas
        if: steps.comprobar.outputs.cubierto == '' && steps.destino.outputs.modo == 'salas'
        run: echo "Arnes por salas en verde."

      - name: Backend Pytest (E2E y Unitarias)
        if: steps.comprobar.outputs.cubierto == '' && steps.destino.outputs.modo == 'completo'
        run: pytest tests/ -v -n auto

      - name: Frontend Build
        if: steps.comprobar.outputs.cubierto == '' && steps.destino.outputs.modo == 'completo'
        working-directory: ./frontend
        run: npm run build

      # Solo llega a success si todos los pasos anteriores pasaron: es el resultado del arnes completo.
      - name: Arnes completo en verde
        id: completo
        if: steps.comprobar.outputs.cubierto == '' && steps.destino.outputs.modo == 'completo'
        run: echo "Arnes completo en verde."

      # ---- Registrar (R1, solo en PR y en verde) --------------------------------------------------------
      - name: Registrar el arbol verificado
        if: success() && github.event_name == 'pull_request'
        env:
          MODO: ${{ steps.destino.outputs.modo }}
        run: python scripts/arbol_verificado.py registrar --salida arbol-verificado.json --modo "$MODO"

      - name: Subir el arbol verificado
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: arbol-verificado
          path: arbol-verificado.json
          retention-days: 30

      # ---- Veredicto ------------------------------------------------------------------------------------
      # Decide el check obligatorio: pasa solo si el arnes que tocaba corrio y paso, o si el PR ya verifico el arbol.
      - name: Un arnes corrio y paso
        if: always()
        env:
          ALCANCE: ${{ steps.destino.outcome }}
          ETIQUETA: ${{ steps.seleccion.outputs.etiqueta }}
          CUBIERTA: ${{ steps.comprobar.outputs.cubierto }}
          HACIA_MAIN: ${{ steps.destino.outputs.hacia_main }}
          MODO: ${{ steps.destino.outputs.modo }}
          HUMO: ${{ steps.humo.outcome }}
          SALAS: ${{ steps.salas.outcome }}
          COMPLETO: ${{ steps.completo.outcome }}
        run: |
          echo "alcance=$ALCANCE ($ETIQUETA) | hacia main=$HACIA_MAIN | modo=$MODO | cubierta=$CUBIERTA | humo=$HUMO | arnes por salas=$SALAS | arnes completo=$COMPLETO"
          if [ "$MODO" = "completo" ] && [ -z "$CUBIERTA" ] && [ "$COMPLETO" != "success" ]; then echo "El arnes completo era obligatorio y no paso."; exit 1; fi
          if [ "$MODO" = "salas" ] && [ -z "$CUBIERTA" ] && [ "$SALAS" != "success" ]; then echo "El arnes por salas era obligatorio y no paso."; exit 1; fi
          test "$ALCANCE" = "success" || { echo "La seleccion de alcance no termino bien."; exit 1; }
          if [ -n "$CUBIERTA" ]; then echo "Cubierto por la corrida $CUBIERTA del PR, que ya verifico este mismo arbol."; exit 0; fi
          test "$HUMO" != "failure" || { echo "El humo fallo: el arnes no arranco. Corrija el flujo que fallo."; exit 1; }
          case "$HUMO$SALAS$COMPLETO" in
            *cancelled*) echo "Un arnes fue cancelado: alguien detuvo la corrida o una mas nueva de la misma rama la dejo obsoleta. Si hace falta, vuelva a lanzar los jobs."; exit 1;;
            *failure*) echo "Un arnes fallo."; exit 1;;
          esac
          test "$SALAS" = "success" || test "$COMPLETO" = "success" || { echo "Ningun arnes corrio."; exit 1; }

  playwright:
    # Las pruebas simulan la API (page.route), asi que no necesitan backend ni secretos. Decide por si mismo, con
    # seleccionar_pruebas.py, si hay especificaciones: sin ellas, o en un push cubierto por R1, termina en verde
    # antes de instalar Node.
    # CI-39: cuatro shards en paralelo con las mismas pruebas; el estado final lo resume playwright-resultado.
    name: Playwright Frontend · shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    permissions:
      contents: read
      actions: read
      # arbol_verificado.py comprobar lee GET /repos/<r>/commits/<sha>/pulls.
      pull-requests: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Sin requirements: seleccionar_pruebas.py y arbol_verificado.py solo usan la biblioteca estandar.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - *seleccionar_pruebas

      - *comprobar_arbol

      - name: Decidir si hay especificaciones
        id: decision
        env:
          SPECS: ${{ steps.seleccion.outputs.playwright_specs }}
          CUBIERTA: ${{ steps.comprobar.outputs.cubierto }}
        run: |
          if [ -n "$CUBIERTA" ]; then
            echo "Cubierto por la corrida $CUBIERTA del PR, que ya verifico este mismo arbol."
            echo "correr=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$SPECS" ]; then
            echo "Sin especificaciones de Playwright para el alcance tocado (omision segura)."
            echo "correr=false" >> "$GITHUB_OUTPUT"
          else
            echo "Especificaciones: $SPECS"
            echo "correr=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.decision.outputs.correr == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        if: steps.decision.outputs.correr == 'true'
        working-directory: ./frontend
        run: npm ci

      - name: Install Chromium
        if: steps.decision.outputs.correr == 'true'
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright Tests
        if: steps.decision.outputs.correr == 'true'
        working-directory: ./frontend
        env:
          CI: "true"
          SPECS: ${{ steps.seleccion.outputs.playwright_specs }}
        run: npx playwright test $SPECS --shard=${{ matrix.shard }}/4

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  # CI-39: un solo estado para la proteccion de rama. Verde si todos los shards pasaron o saltaron (sin
  # especificaciones, o cubierto por el PR); rojo si alguno fallo o se cancelo.
  playwright-resultado:
    name: Playwright Frontend
    needs: playwright
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resumir los shards de Playwright
        env:
          RESULTADO: ${{ needs.playwright.result }}
        run: |
          echo "Shards de Playwright: $RESULTADO"
          test "$RESULTADO" = "success" || { echo "Algun shard de Playwright fallo o fue cancelado."; exit 1; }
