name: Deploy Backend to Google Cloud Run

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: "true publica la revisión en Cloud Run; false solo construye la imagen y muestra su digest"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: evydentia
  REGION: us-central1
  REPOSITORY: evydentia-containers
  SERVICE_NAME: evydentia-backend
  IMAGE_NAME: us-central1-docker.pkg.dev/evydentia/evydentia-containers/backend
  WORKLOAD_IDENTITY_PROVIDER: projects/943042355099/locations/global/workloadIdentityPools/github/providers/github-oidc
  SERVICE_ACCOUNT: sa-github-actions@evydentia.iam.gserviceaccount.com
  BACKEND_SERVICE_ACCOUNT: sa-evydentia-backend@evydentia.iam.gserviceaccount.com
  CLOUD_SQL_INSTANCE: evydentia:us-central1:evydentia-production

jobs:
  deploy:
    name: Build, Push & Deploy to Cloud Run
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: gcp-produccion

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        id: imagen
        run: |
          IMAGE_TAG="${{ env.IMAGE_NAME }}:${{ github.sha }}"
          IMAGE_LATEST="${{ env.IMAGE_NAME }}:latest"

          docker build -t "$IMAGE_TAG" -t "$IMAGE_LATEST" .
          docker push "$IMAGE_TAG"
          docker push "$IMAGE_LATEST"

          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_TAG" | cut -d@ -f2)"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "### Imagen construida" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: $DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to Cloud Run
        if: ${{ inputs.publicar }}
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --region ${{ env.REGION }} \
            --platform managed \
            --service-account ${{ env.BACKEND_SERVICE_ACCOUNT }} \
            --add-cloudsql-instances ${{ env.CLOUD_SQL_INSTANCE }} \
            --set-secrets "DATABASE_URL=DATABASE_URL_APP:latest,JWT_SECRET=JWT_SECRET:latest,SESSION_SECRET=SESSION_SECRET:latest,INVENTARIO_CLAVE_CIFRADO=INVENTARIO_CLAVE_CIFRADO:latest,WEBHOOKS_CLAVE_CIFRADO=WEBHOOKS_CLAVE_CIFRADO:latest,NOTIF_SMTP_CONFIG=evydentia-notif-smtp:latest" \
            --set-env-vars "APP_ENV=production,APP_BASE_URL=https://app.evydentia.com,ENVIRONMENT=production,PROJECT_ID=${{ env.PROJECT_ID }},GCP_STORAGE_BUCKET=${{ env.PROJECT_ID }},GCP_STORAGE_BUCKET_NORMATIVO=evydentia-corpus-normativo,NORMATIVA_TRABAJO_MONITOREO=evydentia-monitoreo-normativo,PROXIES_CONFIABLES=1,CORS_ORIGINS=https://app.evydentia.com,GOOGLE_CLIENT_ID=943042355099-um6ieu8s1s8kettg253g9v5ms8ag7k4l.apps.googleusercontent.com,GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }},VERTEX_LOCATION=us,VERTEX_LOCATION_EMBEDDING=us-central1" \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5 \
            --timeout 150s
